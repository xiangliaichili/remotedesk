[package]
name = "remotedesk"
version = "1.3.0"
description = "remotedesk 远程桌面客户端"
authors = ["remotedesk"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "remotedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = "0.0.14"
enigo = "0.2"
rfd = "0.15"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
